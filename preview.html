function show(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active','printing'));$(p).classList.add('active');document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.p===p));render(p);window.scrollTo(0,0)}
function render(p){({dashboard:renderDashboard,owners:renderOwners,properties:renderProperties,units:renderUnits,tenants:renderTenants,leases:renderLeases,dues:renderDues,receipts:renderReceipts,expenses:renderExpenses,liabilities:renderLiabilities,reports:renderReports}[p]||(()=>{}))()}
function currentPage(){return document.querySelector('.page.active')?.id||'dashboard'}
function del(type,id){if(confirm('هل أنت متأكد من الحذف؟')){db[type]=db[type].filter(x=>x.id!==id);save();render(currentPage())}}
function nextNo(prefix,arr){let mx=arr.reduce((m,x)=>Math.max(m,Number(String(x.no||'').split('-').pop())||0),0);return prefix+'-'+String(mx+1).padStart(5,'0')}
function formPage(section,title,body,onSubmit,afterRender){$(section).innerHTML=`<div class="top"><div><h1>${title}</h1><div class="muted">صفحة كاملة قابلة للتمرير والتعديل</div></div><button class="btn light" type="button" onclick="show('${section}')">رجوع</button></div><div class="card"><form id="editor">${body}<div class="actions" style="margin-top:18px"><button class="btn gold">حفظ</button><button type="button" class="btn light" onclick="show('${section}')">إلغاء</button></div></form></div>`;$('editor').onsubmit=async e=>{e.preventDefault();const form=e.target;if(form.dataset.saving==='true')return;const buttons=[...form.querySelectorAll('button[type=submit],button:not([type])')];const snapshot=JSON.stringify(db);form.dataset.saving='true';buttons.forEach(b=>b.disabled=true);let error=form.querySelector('.form-error');if(error)error.remove();try{await onSubmit(Object.fromEntries(new FormData(form)),form);save();form.dispatchEvent(new Event('alola:saved'));show(section)}catch(err){window.AlolaRestore?window.AlolaRestore(snapshot):db=JSON.parse(snapshot);try{localStorage.setItem(KEY,snapshot)}catch(storageError){}error=document.createElement('div');error.className='form-error';error.setAttribute('role','alert');error.textContent=window.AlolaI18n?.translate(err.message||'تعذر الحفظ. تحقق من المساحة المتاحة واحتفظ بنسخة احتياطية.')||err.message;form.prepend(error);error.scrollIntoView({block:'nearest'});}finally{form.dataset.saving='false';buttons.forEach(b=>b.disabled=false)}};if(afterRender)afterRender()}
function monthsBetween(start,end,step){let a=[],d=new Date(start+'T00:00:00'),e=new Date(end+'T00:00:00');while(d<=e){a.push(d.toISOString().slice(0,10));d.setMonth(d.getMonth()+step)}return a}
function frequencyMonths(f){return {'شهري':1,'ربع سنوي':3,'نصف سنوي':6,'سنوي':12}[f]||1}
function duePaid(dueId){return db.receipts.filter(r=>r.dueId===dueId).reduce((a,r)=>a+Number(r.amount||0),0)}
function dueStatus(d){let p=duePaid(d.id),rem=Number(d.amount)-p;if(rem<=0)return 'مدفوع';if(p>0)return 'مدفوع جزئياً';if(d.dueDate<today())return 'متأخر';return 'مستحق'}
function dueBadge(s){return `<span class="badge ${s==='مدفوع'?'ok':s==='متأخر'?'bad':s==='مدفوع جزئياً'?'warn':''}">${s}</span>`}
function activeLeaseForTenant(tid){return db.leases.find(l=>l.tenantId===tid&&l.status==='نشط')}
function activeLeaseForUnit(uid){return db.leases.find(l=>l.unitId===uid&&l.status==='نشط')}
function ownerFigures(ownerId,month='',propertyId='',unitId=''){let rs=db.receipts.filter(r=>r.ownerId===ownerId&&(!month||String(r.date).startsWith(month))&&(!propertyId||r.propertyId===propertyId)&&(!unitId||r.unitId===unitId)),es=db.expenses.filter(e=>e.ownerId===ownerId&&(!month||String(e.date).startsWith(month))&&(!propertyId||e.propertyId===propertyId)&&(!unitId||e.unitId===unitId)),ts=db.ownerTransfers.filter(t=>t.ownerId===ownerId&&(!month||String(t.date).startsWith(month))&&(!propertyId&&!unitId));let o=get('owners',ownerId)||{};return{receipts:rs,expenses:es,transfers:ts,income:rs.reduce((a,x)=>a+Number(x.amount||0),0),expense:es.reduce((a,x)=>a+Number(x.amount||0),0),transferred:ts.reduce((a,x)=>a+Number(x.amount||0),0),opening:Number(o.openingLiability||0)}}
function ownerLiability(ownerId){let f=ownerFigures(ownerId);return f.opening+f.income-f.expense-f.transferred}
function officeFigures(){let receiptCash=db.receipts.reduce((a,x)=>a+Number(x.amount||0),0),propertyExpense=db.expenses.reduce((a,x)=>a+Number(x.amount||0),0),ownerTransfers=db.ownerTransfers.reduce((a,x)=>a+Number(x.amount||0),0),officeIncome=db.officeEntries.filter(x=>x.type==='دخل').reduce((a,x)=>a+Number(x.amount||0),0),officeExpense=db.officeEntries.filter(x=>x.type==='مصروف').reduce((a,x)=>a+Number(x.amount||0),0),opening=Number(db.settings.officeOpeningBalance||0);return{receiptCash,propertyExpense,ownerTransfers,officeIncome,officeExpense,opening,closing:opening+receiptCash-propertyExpense-ownerTransfers+officeIncome-officeExpense}}
function renderDashboard(){let of=officeFigures(),occupied=db.units.filter(u=>activeLeaseForUnit(u.id)).length,outstanding=db.dues.filter(d=>d.dueDate<=today()).reduce((a,d)=>a+Math.max(0,Number(d.amount)-duePaid(d.id)),0);$('dashboard').innerHTML=`<div class="top"><div><h1>لوحة التحكم</h1><div class="muted">الأولى لإدارة الأملاك</div></div><div class="actions"><button class="btn gold" onclick="receiptForm()">+ سند قبض</button><button class="btn" onclick="expenseForm()">+ سند صرف</button></div></div><div class="cards"><div class="card"><div class="kpi-label">العقارات</div><div class="num">${db.properties.length}</div></div><div class="card"><div class="kpi-label">الوحدات المؤجرة</div><div class="num">${occupied}/${db.units.length}</div></div><div class="card"><div class="kpi-label">المستحقات غير المسددة</div><div class="num">${money(outstanding)}</div></div><div class="card"><div class="kpi-label">رصيد المكتب النقدي</div><div class="num">${money(of.closing)}</div></div></div><div class="profile"><div class="card"><h3>ذمم الملاك الحالية</h3>${db.owners.map(o=>`<div class="linkcard"><b>${esc(o.name)}</b><div class="num" style="font-size:18px">${money(ownerLiability(o.id))}</div></div>`).join('')||'<div class="empty">لا يوجد ملاك</div>'}</div><div class="card"><h3>ملخص المكتب</h3><p>نقد داخل من سندات القبض: <b>${money(of.receiptCash)}</b></p><p>مصروفات عقارات: <b>${money(of.propertyExpense)}</b></p><p>تحويلات للملاك: <b>${money(of.ownerTransfers)}</b></p><p>دخل المكتب: <b>${money(of.officeIncome)}</b></p><p>مصروف المكتب: <b>${money(of.officeExpense)}</b></p></div></div>`}
function renderOwners(){let rows=db.owners.map(o=>{let f=ownerFigures(o.id);return `<tr><td><button class="btn light" onclick="ownerProfile('${o.id}')">${esc(o.name)}</button></td><td>${db.properties.filter(p=>p.ownerId===o.id).length}</td><td>${money(f.income)}</td><td>${money(f.expense)}</td><td>${money(f.transferred)}</td><td><b>${money(ownerLiability(o.id))}</b></td><td class="actions"><button class="btn light" onclick="ownerForm('${o.id}')">تعديل</button><button class="btn danger" onclick="del('owners','${o.id}')">حذف</button></td></tr>`}).join('');$('owners').innerHTML=`<div class="top"><div><h1>الملاك</h1><div class="muted">ملف ومحفظة وذمة مالية لكل مالك</div></div><button class="btn gold" onclick="ownerForm()">+ إضافة مالك</button></div><div class="card tablewrap">${rows?`<table class="table"><tr><th>المالك</th><th>العقارات</th><th>القبض</th><th>الصرف</th><th>المحول</th><th>الذمة الحالية</th><th>إجراءات</th></tr>${rows}</table>`:'<div class="empty">لا يوجد ملاك</div>'}</div>`}
function ownerForm(id=''){let o=get('owners',id)||{};formPage('owners',id?'تعديل المالك':'إضافة مالك',`<div class="formgrid"><div><label>اسم المالك</label><input name="name" required value="${esc(o.name)}"></div><div><label>الهوية / السجل</label><input name="idNo" value="${esc(o.idNo)}"></div><div><label>الجوال</label><input name="phone" value="${esc(o.phone)}"></div><div><label>البريد</label><input name="email" value="${esc(o.email)}"></div><div><label>البنك</label><input name="bank" value="${esc(o.bank)}"></div><div><label>IBAN</label><input name="iban" value="${esc(o.iban)}"></div><div><label>رصيد الذمة الافتتاحي</label><input type="number" name="openingLiability" value="${Number(o.openingLiability||0)}"></div><div class="full"><label>ملاحظات</label><textarea name="notes">${esc(o.notes)}</textarea></div></div>`,x=>{x.openingLiability=Number(x.openingLiability||0);id?Object.assign(o,x):db.owners.push({...x,id:uid('OWN')})})}
function ownerProfile(id){let o=get('owners',id),ps=db.properties.filter(p=>p.ownerId===id),f=ownerFigures(id);$('owners').innerHTML=`<div class="top"><div><h1>${esc(o.name)}</h1><div class="muted">ملف المالك ومحفظته</div></div><div class="actions"><button class="btn gold" onclick="ownerTransferForm('${id}')">+ تسجيل تحويل للمالك</button><button class="btn light" onclick="ownerForm('${id}')">تعديل</button><button class="btn light" onclick="show('owners')">رجوع</button></div></div><div class="cards"><div class="card">العقارات<div class="num">${ps.length}</div></div><div class="card">القبض<div class="num">${money(f.income)}</div></div><div class="card">الصرف<div class="num">${money(f.expense)}</div></div><div class="card">الذمة الحالية<div class="num">${money(ownerLiability(id))}</div></div></div><div class="profile"><div class="card"><h3>بيانات المالك</h3><p>الجوال: ${esc(o.phone)}</p><p>البنك: ${esc(o.bank)}</p><p>IBAN: ${esc(o.iban)}</p></div><div class="card"><h3>العقارات</h3>${ps.map(p=>`<div class="linkcard"><b>${esc(p.name)}</b><div class="muted">${esc(p.type)} — ${db.units.filter(u=>u.propertyId===p.id).length} وحدة</div></div>`).join('')||'—'}</div><div class="card wide"><h3>الحركة المالية</h3>${ownerTransactionTable(id)}</div></div>`}
function renderProperties(){let rows=db.properties.map(p=>`<tr><td><button class="btn light" onclick="propertyProfile('${p.id}')">${esc(p.name)}</button></td><td>${esc(p.type)}</td><td>${esc(ownerName(p.ownerId))}</td><td>${db.units.filter(u=>u.propertyId===p.id).length}</td><td>${esc(p.status||'نشط')}</td><td class="actions"><button class="btn light" onclick="propertyForm('${p.id}')">تعديل</button><button class="btn danger" onclick="del('properties','${p.id}')">حذف</button></td></tr>`).join('');$('properties').innerHTML=`<div class="top"><div><h1>العقارات</h1><div class="muted">العقار حاوية والوحدة هي المساحة المؤجرة فعلياً</div></div><button class="btn gold" onclick="propertyForm()">+ إضافة عقار</button></div><div class="card tablewrap">${rows?`<table class="table"><tr><th>العقار</th><th>النوع</th><th>المالك</th><th>الوحدات</th><th>الحالة</th><th>إجراءات</th></tr>${rows}</table>`:'<div class="empty">لا توجد عقارات</div>'}</div>`}
</script><script>
function propertyForm(id=''){let p=get('properties',id)||{type:'عمارة سكنية',status:'نشط'};formPage('properties',id?'تعديل العقار':'إضافة عقار',`<div class="formgrid"><div><label>اسم العقار</label><input name="name" required value="${esc(p.name)}"></div><div><label>نوع العقار</label><select name="type">${['عمارة سكنية','عمارة تجارية','مبنى تجاري','فيلا','شقة مستقلة','بوتيك','محل تجاري','مكتب','بدروم','مستودع','أرض','أخرى'].map(x=>`<option ${p.type===x?'selected':''}>${x}</option>`).join('')}</select><div class="field-help">اختر «عمارة تجارية» للمبنى الذي يجمع شققاً سكنية ومحلات تجارية.</div></div><div><label>المالك</label><select name="ownerId" required><option value="">اختر</option>${db.owners.map(o=>`<option value="${o.id}" ${p.ownerId===o.id?'selected':''}>${esc(o.name)}</option>`).join('')}</select></div><div><label>الحالة</label><select name="status"><option ${p.status!=='مغلق'?'selected':''}>نشط</option><option ${p.status==='مغلق'?'selected':''}>مغلق</option></select></div><div class="full"><label>العنوان</label><input name="address" value="${esc(p.address)}"></div><div class="full"><label>ملاحظات</label><textarea name="notes">${esc(p.notes)}</textarea></div></div><div class="notice" style="margin-top:15px">إذا كان العقار عمارة سكنية أو عمارة تجارية أو مبنى تجارياً، أضف وحداته بعد الحفظ. ويمكن للعمارة التجارية أن تحتوي على وحدات من نوع «شقة» و«محل تجاري» معاً.</div>`,x=>{if(id)Object.assign(p,x);else{let np={...x,id:uid('PROP')};db.properties.push(np);if(!['عمارة سكنية','عمارة تجارية','مبنى تجاري'].includes(x.type))db.units.push({id:uid('UNIT'),propertyId:np.id,name:x.name,type:x.type,rent:0,floor:'',reference:''})}})}
function propertyProfile(id){let p=get('properties',id),us=db.units.filter(u=>u.propertyId===id),rs=db.receipts.filter(r=>r.propertyId===id),es=db.expenses.filter(e=>e.propertyId===id);$('properties').innerHTML=`<div class="top"><div><h1>${esc(p.name)}</h1><div class="muted">${esc(p.type)} — ${esc(ownerName(p.ownerId))}</div></div><div class="actions"><button class="btn gold" onclick="unitForm('', '${id}')">+ إضافة وحدة</button><button class="btn light" onclick="propertyForm('${id}')">تعديل العقار</button><button class="btn light" onclick="show('properties')">رجوع</button></div></div><div class="cards"><div class="card">الوحدات<div class="num">${us.length}</div></div><div class="card">المؤجرة<div class="num">${us.filter(u=>activeLeaseForUnit(u.id)).length}</div></div><div class="card">القبض<div class="num">${money(rs.reduce((a,x)=>a+Number(x.amount||0),0))}</div></div><div class="card">الصرف<div class="num">${money(es.reduce((a,x)=>a+Number(x.amount||0),0))}</div></div></div><div class="card"><h3>الوحدات والتصنيفات الفرعية</h3>${us.map(u=>`<div class="linkcard"><b>${esc(u.name)}</b> — ${esc(u.type)} — ${money(u.rent)} ${dueBadge(activeLeaseForUnit(u.id)?'مدفوع جزئياً':'مستحق').replace('مدفوع جزئياً',activeLeaseForUnit(u.id)?'مؤجر':'متاح').replace('مستحق','متاح')}<div class="actions" style="margin-top:8px"><button class="btn light" onclick="unitProfile('${u.id}')">فتح</button><button class="btn light" onclick="unitForm('${u.id}')">تعديل</button><button class="btn danger" onclick="del('units','${u.id}');propertyProfile('${id}')">حذف</button></div></div>`).join('')||'<div class="empty">أضف الوحدات التابعة للعقار</div>'}</div>`}
function renderUnits(){let rows=db.units.map(u=>{let p=get('properties',u.propertyId),l=activeLeaseForUnit(u.id);return `<tr><td><button class="btn light" onclick="unitProfile('${u.id}')">${esc(u.name)}</button></td><td>${esc(u.type)}</td><td>${esc(p?.name)}</td><td>${esc(ownerName(p?.ownerId))}</td><td>${money(u.rent)}</td><td>${l?esc(tenantName(l.tenantId)):'—'}</td><td>${dueBadge(l?'مدفوع جزئياً':'مستحق').replace('مدفوع جزئياً','مؤجر').replace('مستحق','متاح')}</td><td class="actions"><button class="btn light" onclick="unitForm('${u.id}')">تعديل</button><button class="btn danger" onclick="del('units','${u.id}')">حذف</button></td></tr>`}).join('');$('units').innerHTML=`<div class="top"><div><h1>الوحدات</h1><div class="muted">شقة/بوتيك/محل/مكتب/بدروم كسجل مستقل</div></div><button class="btn gold" onclick="unitForm()">+ إضافة وحدة</button></div><div class="card tablewrap">${rows?`<table class="table"><tr><th>الوحدة</th><th>النوع</th><th>العقار</th><th>المالك</th><th>الإيجار</th><th>المستأجر</th><th>الحالة</th><th>إجراءات</th></tr>${rows}</table>`:'<div class="empty">لا توجد وحدات</div>'}</div>`}
function unitForm(id='',propertyId=''){let u=get('units',id)||{propertyId,type:'شقة'};formPage('units',id?'تعديل الوحدة':'إضافة وحدة',`<div class="formgrid"><div><label>العقار</label><select name="propertyId" required><option value="">اختر</option>${db.properties.map(p=>`<option value="${p.id}" ${u.propertyId===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div><label>اسم/رقم الوحدة</label><input name="name" required value="${esc(u.name)}" placeholder="مثال: شقة 101 أو محل 1"></div><div><label>نوع الوحدة</label><select name="type">${['شقة','محل تجاري','بوتيك','مكتب','بدروم','مستودع','فيلا','أخرى'].map(x=>`<option ${u.type===x?'selected':''}>${x}</option>`).join('')}</select><div class="field-help">يمكن إضافة شقق ومحلات تجارية معاً تحت «عمارة تجارية» واحدة.</div></div><div><label>الإيجار الشهري الافتراضي</label><input type="number" name="rent" value="${Number(u.rent||0)}"></div><div><label>الدور</label><input name="floor" value="${esc(u.floor)}"></div><div><label>رقم/مرجع الوحدة</label><input name="reference" value="${esc(u.reference)}"></div><div class="full"><label>ملاحظات</label><textarea name="notes">${esc(u.notes)}</textarea></div></div>`,x=>{x.rent=Number(x.rent||0);id?Object.assign(u,x):db.units.push({...x,id:uid('UNIT')})})}
function unitProfile(id){let u=get('units',id),p=get('properties',u.propertyId),l=activeLeaseForUnit(id),rs=db.receipts.filter(r=>r.unitId===id),es=db.expenses.filter(e=>e.unitId===id);$('units').innerHTML=`<div class="top"><div><h1>${esc(u.name)}</h1><div class="muted">${esc(p?.name)} — ${esc(ownerName(p?.ownerId))}</div></div><div class="actions"><button class="btn light" onclick="unitForm('${id}')">تعديل</button><button class="btn light" onclick="show('units')">رجوع</button></div></div><div class="cards"><div class="card">الحالة<div class="num">${l?'مؤجر':'متاح'}</div></div><div class="card">المستأجر<div class="num" style="font-size:19px">${l?esc(tenantName(l.tenantId)):'—'}</div></div><div class="card">القبض<div class="num">${money(rs.reduce((a,x)=>a+Number(x.amount||0),0))}</div></div><div class="card">الصرف<div class="num">${money(es.reduce((a,x)=>a+Number(x.amount||0),0))}</div></div></div><div class="card"><h3>العقد الحالي</h3>${l?`<div class="linkcard">${esc(l.contractNo||l.id)} — ${esc(l.startDate)} إلى ${esc(l.endDate)} — ${money(l.monthlyRent)}/شهر</div>`:'لا يوجد عقد نشط'}</div>`}
function renderTenants(){let rows=db.tenants.map(t=>{let l=activeLeaseForTenant(t.id);return `<tr><td><button class="btn light" onclick="tenantProfile('${t.id}')">${esc(t.name)}</button></td><td>${l?esc(propertyName(get('units',l.unitId)?.propertyId)):'—'}</td><td>${l?esc(unitName(l.unitId)):'—'}</td><td>${l?money(l.monthlyRent):'—'}</td><td>${tenantBalance(t.id).status}</td><td class="actions"><button class="btn light" onclick="tenantForm('${t.id}')">تعديل</button><button class="btn danger" onclick="del('tenants','${t.id}')">حذف</button></td></tr>`}).join('');$('tenants').innerHTML=`<div class="top"><div><h1>المستأجرون</h1><div class="muted">ملف مستقل يحتفظ بالعقود والمدفوعات والتاريخ</div></div><button class="btn gold" onclick="tenantForm()">+ إضافة مستأجر</button></div><div class="card tablewrap">${rows?`<table class="table"><tr><th>المستأجر</th><th>العقار</th><th>الوحدة</th><th>الإيجار الشهري</th><th>الحالة المالية</th><th>إجراءات</th></tr>${rows}</table>`:'<div class="empty">لا يوجد مستأجرون</div>'}</div>`}
function tenantForm(id=''){let t=get('tenants',id)||{},active=id?activeLeaseForTenant(id):null,activeUnit=active?get('units',active.unitId):null,selectedProperty=activeUnit?.propertyId||'';formPage('tenants',id?'تعديل المستأجر والعقار المستأجر':'إضافة مستأجر وعقار مستأجر',`<div class="formgrid"><div><label>الاسم</label><input name="name" required value="${esc(t.name)}"></div><div><label>الهوية / الإقامة</label><input name="idNo" value="${esc(t.idNo)}"></div><div><label>الجوال</label><input name="phone" value="${esc(t.phone)}"></div><div><label>البريد</label><input name="email" value="${esc(t.email)}"></div><div class="full"><h3 style="margin-bottom:4px">العقار الذي يستأجره</h3><div class="muted small">يمكنك ربط المستأجر بعقار ووحدة الآن، أو تركها فارغة وإضافة عقد لاحقاً.</div></div><div><label>العقار</label><select name="propertyId" id="tenantProperty"><option value="">بدون عقار حالياً</option>${db.properties.map(p=>`<option value="${p.id}" ${selectedProperty===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div><label>الوحدة المستأجرة</label><select name="unitId" id="tenantUnit"><option value="">اختر العقار أولاً</option></select></div><div><label>الإيجار الشهري</label><input type="number" name="monthlyRent" id="tenantRent" value="${Number(active?.monthlyRent||0)}"></div><div><label>رقم/مرجع العقد</label><input name="contractNo" value="${esc(active?.contractNo)}"></div><div><label>بداية الإيجار</label><input type="date" name="startDate" value="${esc(active?.startDate||today())}"></div><div><label>نهاية الإيجار</label><input type="date" name="endDate" value="${esc(active?.endDate)}"></div><div class="full"><label>ملاحظات</label><textarea name="notes">${esc(t.notes)}</textarea></div></div>`,x=>{let rental={propertyId:x.propertyId,unitId:x.unitId,monthlyRent:Number(x.monthlyRent||0),contractNo:x.contractNo,startDate:x.startDate,endDate:x.endDate};delete x.propertyId;delete x.unitId;delete x.monthlyRent;delete x.contractNo;delete x.startDate;delete x.endDate;let tenant=t;if(id)Object.assign(tenant,x);else{tenant={...x,id:uid('TEN')};db.tenants.push(tenant)}if(rental.unitId){if(!rental.startDate||!rental.endDate){alert('أدخل تاريخ بداية ونهاية الإيجار');throw new Error('missing lease dates')}let lease=active||{id:uid('LEASE'),tenantId:tenant.id,status:'نشط',frequency:'شهري',deposit:0,attachment:null};Object.assign(lease,{tenantId:tenant.id,unitId:rental.unitId,monthlyRent:rental.monthlyRent||Number(get('units',rental.unitId)?.rent||0),contractNo:rental.contractNo,startDate:rental.startDate,endDate:rental.endDate});if(!active){db.leases.push(lease);generateDues(lease.id,true)}}},()=>{let property=$('tenantProperty'),unit=$('tenantUnit'),rent=$('tenantRent');function fillUnits(){let pid=property.value,current=active?.unitId||'',items=db.units.filter(u=>u.propertyId===pid);unit.innerHTML='<option value="">اختر الوحدة</option>'+items.map(u=>`<option value="${u.id}" ${current===u.id?'selected':''}>${esc(u.name)} — ${money(u.rent)}</option>`).join('')}property.onchange=()=>{fillUnits();rent.value=''};unit.onchange=()=>{rent.value=get('units',unit.value)?.rent||0};fillUnits()})}
function tenantBalance(tid){let dues=db.dues.filter(d=>get('leases',d.leaseId)?.tenantId===tid&&d.dueDate<=today()),due=dues.reduce((a,d)=>a+Number(d.amount||0),0),paid=db.receipts.filter(r=>r.tenantId===tid).reduce((a,r)=>a+Number(r.amount||0),0),balance=due-paid;return{due,paid,balance,status:balance<=0?'<span class="badge ok">مسدد</span>':`<span class="badge ${paid>0?'warn':'bad'}">متبقي ${money(balance)}</span>`}}
function tenantProfile(id){let t=get('tenants',id),ls=db.leases.filter(l=>l.tenantId===id),rs=db.receipts.filter(r=>r.tenantId===id),b=tenantBalance(id),active=activeLeaseForTenant(id),td=db.dues.filter(d=>ls.some(l=>l.id===d.leaseId));$('tenants').innerHTML=`<div class="top"><div><h1>${esc(t.name)}</h1><div class="muted">الملف المالي والتعاقدي للمستأجر</div></div><div class="actions"><button class="btn gold" onclick="leaseForm('', '${id}')">+ عقد</button><button class="btn gold" onclick="receiptForm('', '${id}')">+ سند قبض</button><button class="btn light" onclick="tenantForm('${id}')">تعديل</button><button class="btn light" onclick="show('tenants')">رجوع</button></div></div><div class="cards"><div class="card">العقار الحالي<div class="num" style="font-size:18px">${active?esc(propertyName(get('units',active.unitId)?.propertyId)):'—'}</div></div><div class="card">الوحدة<div class="num" style="font-size:18px">${active?esc(unitName(active.unitId)):'—'}</div></div><div class="card">مستحق حتى اليوم<div class="num">${money(b.due)}</div></div><div class="card">المتبقي<div class="num">${money(Math.max(0,b.balance))}</div></div></div><div class="profile"><div class="card"><h3>العقود</h3>${ls.map(l=>`<div class="linkcard"><b>${esc(l.contractNo||l.id)}</b><br>${esc(unitName(l.unitId))} — ${money(l.monthlyRent)}/شهر — <span class="badge">${esc(l.status)}</span>${l.attachment?.name?`<div style="margin-top:8px"><button class="btn light" onclick="openLeaseAttachment('${l.id}')">فتح مرفق العقد</button></div>`:''}</div>`).join('')||'—'}</div><div class="card"><h3>الاستحقاقات</h3>${td.map(d=>`<div class="linkcard">${esc(d.dueDate)} — ${money(d.amount)} — ${dueBadge(dueStatus(d))}<br><span class="small">مدفوع: ${money(duePaid(d.id))} | متبقي: ${money(Math.max(0,d.amount-duePaid(d.id)))}</span></div>`).join('')||'—'}</div><div class="card wide"><h3>سندات القبض</h3>${rs.length?`<div class="tablewrap"><table class="table"><tr><th>السند</th><th>التاريخ</th><th>المبلغ</th><th>العقار</th>< </script><script>
function renderLeases(){let rows=db.leases.map(l=>`<tr><td>${esc(l.contractNo||l.id)}</td><td>${esc(tenantName(l.tenantId))}</td><td>${esc(propertyName(get('units',l.unitId)?.propertyId))}</td><td>${esc(unitName(l.unitId))}</td><td>${money(l.monthlyRent)}</td><td>${esc(l.frequency)}</td><td>${esc(l.startDate)} → ${esc(l.endDate)}</td><td><span class="badge">${esc(l.status)}</span></td><td class="actions">${l.attachment?.name?`<button class="btn light" onclick="openLeaseAttachment('${l.id}')">فتح العقد</button>`:''}<button class="btn light" onclick="leaseForm('${l.id}')">تعديل</button><button class="btn light" onclick="generateDues('${l.id}')">توليد الاستحقاقات</button><button class="btn danger" onclick="del('leases','${l.id}')">حذف</button></td></tr>`).join('');$('leases').innerHTML=`<div class="top"><div><h1>العقود</h1><div class="muted">العقد هو الرابط بين المستأجر والوحدة ويحدد الاستحقاقات</div></div><button class="btn gold" onclick="leaseForm()">+ عقد جديد</button></div><div class="card tablewrap">${rows?`<table class="table"><tr><th>العقد</th><th>المستأجر</th><th>العقار</th><th>الوحدة</th><th>الإيجار الشهري</th><th>الدورية</th><th>المدة</th><th>الحالة</th><th>إجراءات</th></tr>${rows}</table>`:'<div class="empty">لا توجد عقود</div>'}</div>`}
function leaseForm(id='',tenantId=''){let l=get('leases',id)||{tenantId,status:'نشط',frequency:'شهري'};formPage('leases',id?'تعديل العقد':'عقد جديد',`<div class="formgrid"><div><label>المستأجر</label><select name="tenantId" required><option value="">اختر</option>${db.tenants.map(t=>`<option value="${t.id}" ${l.tenantId===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div><div><label>الوحدة</label><select name="unitId" id="leaseUnit" required><option value="">اختر</option>${db.units.map(u=>`<option value="${u.id}" ${l.unitId===u.id?'selected':''}>${esc(propertyName(u.propertyId))} — ${esc(u.name)}</option>`).join('')}</select></div><div><label>الإيجار الشهري</label><input type="number" name="monthlyRent" id="leaseRent" value="${Number(l.monthlyRent||0)}"></div><div><label>مبلغ التأمين</label><input type="number" name="deposit" value="${Number(l.deposit||0)}"></div><div><label>بداية العقد</label><input type="date" name="startDate" required value="${esc(l.startDate)}"></div><div><label>نهاية العقد</label><input type="date" name="endDate" required value="${esc(l.endDate)}"></div><div><label>دورية السداد</label><select name="frequency">${['شهري','ربع سنوي','نصف سنوي','سنوي'].map(x=>`<option ${l.frequency===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>الحالة</label><select name="status"><option ${l.status!=='منتهي'?'selected':''}>نشط</option><option ${l.status==='منتهي'?'selected':''}>منتهي</option></select></div><div><label>رقم/مرجع العقد</label><input name="contractNo" value="${esc(l.contractNo)}"></div><div><label>مرفق العقد (PDF/JPG/PNG حتى 1.5MB)</label><input type="file" id="leaseFile" accept=".pdf,.jpg,.jpeg,.png"><div class="small muted">${l.attachment?.name?'المرفق الحالي: '+esc(l.attachment.name):''}</div></div></div>`,async x=>{x.monthlyRent=Number(x.monthlyRent||0);x.deposit=Number(x.deposit||0);let file=$('leaseFile').files[0];if(file){if(file.size>1500000){alert('حجم الملف كبير لهذه النسخة. الحد 1.5MB');throw new Error('file too large')}x.attachment=await fileToData(file)}else x.attachment=l.attachment||null;if(id)Object.assign(l,x);else{let nl={...x,id:uid('LEASE')};db.leases.push(nl);generateDues(nl.id,true)}},()=>{$('leaseUnit').onchange=()=>{$('leaseRent').value=get('units',$('leaseUnit').value)?.rent||0}})}

function generateDues(leaseId,silent=false){let l=get('leases',leaseId);if(!l||!l.startDate||!l.endDate)return;let existing=db.dues.filter(d=>d.leaseId===leaseId),hasPaid=existing.some(d=>duePaid(d.id)>0);if(hasPaid&&!silent){alert('يوجد استحقاقات عليها مدفوعات. لن يتم حذفها.');return}if(!hasPaid)db.dues=db.dues.filter(d=>d.leaseId!==leaseId);let step=frequencyMonths(l.frequency),dates=monthsBetween(l.startDate,l.endDate,step),amount=Number(l.monthlyRent||0)*step;for(const d of dates)db.dues.push({id:uid('DUE'),leaseId,dueDate:d,amount,description:`إيجار ${l.frequency}`});save();if(!silent){alert('تم توليد الاستحقاقات');renderLeases()}}
function renderDues(){let rows=db.dues.slice().sort((a,b)=>String(a.dueDate).localeCompare(String(b.dueDate))).map(d=>{let l=get('leases',d.leaseId),paid=duePaid(d.id),rem=Math.max(0,Number(d.amount)-paid);return `<tr><td>${esc(d.dueDate)}</td><td>${esc(tenantName(l?.tenantId))}</td><td>${esc(propertyName(get('units',l?.unitId)?.propertyId))}</td><td>${esc(unitName(l?.unitId))}</td><td>${money(d.amount)}</td><td>${money(paid)}</td><td>${money(rem)}</td><td>${dueBadge(dueStatus(d))}</td><td class="actions"><button class="btn gold" onclick="receiptForm('', '${l?.tenantId||''}', '${d.id}')">تسجيل دفعة</button><button class="btn light" onclick="dueForm('${d.id}')">تعديل</button><button class="btn danger" onclick="del('dues','${d.id}')">حذف</button></td></tr>`}).join('');$('dues').innerHTML=`<div class="top"><div><h1>الاستحقاقات</h1><div class="muted">ما هو مستحق، ما تم دفعه، وما تبقى لكل مستأجر</div></div><button class="btn gold" onclick="dueForm()">+ استحقاق يدوي</button></div><div class="card tablewrap">${rows?`<table class="table"><tr><th>تاريخ الاستحقاق</th><th>المستأجر</th><th>العقار</th><th>الوحدة</th><th>المستحق</th><th>المدفوع</th><th>المتبقي</th><th>الحالة</th><th>إجراءات</th></tr>${rows}</table>`:'<div class="empty">لا توجد استحقاقات</div>'}</div>`}

function renderReceipts(){let rows=db.receipts.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).map(r=>`<tr><td>${esc(r.no)}</td><td>${esc(tenantName(r.tenantId))}</td><td>${esc(propertyName(r.propertyId))}</td><td>${esc(unitName(r.unitId))}</td><td>${money(r.amount)}</td><td>${esc(r.date)}</td><td>${esc(r.method)}</td><td class="actions"><button class="btn light" onclick="receiptForm('${r.id}')">تعديل</button><button class="btn" onclick="openReceipt('${r.id}')">فتح/طباعة</button><button class="btn danger" onclick="del('receipts','${r.id}')">حذف</button></td></tr>`).join('');$('receipts').innerHTML=`<div class="top"><div><h1>سندات القبض</h1><div class="muted">اختر المستأجر؛ العقد والوحدة والعقار والمالك تُملأ تلقائياً</div></div><button class="btn gold" onclick="receiptForm()">+ سند قبض</button></div><div class="card tablewrap">${rows?`<table class="table"><tr><th>السند</th><th>المستأجر</th><th>العقار</th><th>الوحدة</th><th>المبلغ</th><th>التاريخ</th><th>الطريقة</th><th>إجراءات</th></tr>${rows}</table>`:'<div class="empty">لا توجد سندات قبض</div>'}</div>`}
function receiptForm(id='',tenantId='',dueId=''){let r=get('receipts',id)||{tenantId,dueId,date:today(),method:'تحويل بنكي'};formPage('receipts',id?'تعديل سند قبض':'سند قبض جديد',`<div class="formgrid"><div><label>المستأجر</label><select name="tenantId" id="rTenant" required><option value="">اختر</option>${db.tenants.map(t=>`<option value="${t.id}" ${r.tenantId===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div><div><label>العقد</label><select name="leaseId" id="rLease" required></select></div><div><label>الاستحقاق (اختياري)</label><select name="dueId" id="rDue"></select></div><div><label>العقار</label><input id="rPropertyText" disabled></div><div><label>الوحدة</label><input id="rUnitText" disabled></div><div><label>المالك</label><input id="rOwnerText" disabled></div><div><label>المبلغ</label><input type="number" name="amount" id="rAmount" required value="${Number(r.amount||0)}"></div><div><label>التاريخ</label><input type="date" name="date" value="${r.date}"></div><div><label>طريقة الدفع</label><select name="method">${['تحويل بنكي','نقداً','بطاقة','شيك'].map(x=>`<option ${r.method===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="full"><label>الوصف</label><textarea name="description">${esc(r.description||'دفعة إيجار')}</textarea></div></div>`,x=>{let l=get('leases',x.leaseId),u=get('units',l?.unitId),p=get('properties',u?.propertyId);Object.assign(x,{unitId:u?.id||'',propertyId:p?.id||'',ownerId:p?.ownerId||'',amount:Number(x.amount||0)});if(id)Object.assign(r,x);else db.receipts.push({...x,id:uid('RC'),no:nextNo('RC',db.receipts)})},()=>{function syncTenant(){let ls=db.leases.filter(l=>l.tenantId===$('rTenant').value);$('rLease').innerHTML='<option value="">اختر العقد</option>'+ls.map(l=>`<option value="${l.id}" ${r.leaseId===l.id?'selected':''}>${esc(l.contractNo||l.id)} — ${esc(unitName(l.unitId))}</option>`).join('');if(!r.leaseId&&ls.length===1)$('rLease').value=ls[0].id;syncLease()}function syncLease(){let l=get('leases',$('rLease').value),u=get('units',l?.unitId),p=get('properties',u?.propertyId);$('rPropertyText').value=p?.name||'';$('rUnitText').value=u?.name||'';$('rOwnerText').value=ownerName(p?.ownerId);let dues=db.dues.filter(d=>d.leaseId===l?.id&&Math.max(0,d.amount-duePaid(d.id))>0);$('rDue').innerHTML='<option value="">بدون ربط باستحقاق</option>'+dues.map(d=>`<option value="${d.id}" ${r.dueId===d.id?'selected':''}>${esc(d.dueDate)} — متبقي ${money(Math.max(0,d.amount-duePaid(d.id)))}</option>`).join('');if(r.dueId)$('rDue').value=r.dueId;syncDue()}function syncDue(){let d=get('dues',$('rDue').value);if(d&&!id)$('rAmount').value=Math.max(0,d.amount-duePaid(d.id))}$('rTenant').onchange=syncTenant;$('rLease').onchange=syncLease;$('rDue').onchange=syncDue;syncTenant()})}

</script><script>/* Shared deterministic accounting and calendar rules, independent of the UI. */
(function(root){

 function dates(start,end,step){

   const value=year+'-'+String(month+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
