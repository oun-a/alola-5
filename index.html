<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الأولى لإدارة الأملاك</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f5f6f9;color:#18213a}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.side{width:245px;position:fixed;right:0;top:0;bottom:0;background:#20245f;color:#fff;padding:18px;overflow:auto}.brand{display:flex;gap:10px;align-items:center;border-bottom:1px solid #ffffff25;padding-bottom:15px;margin-bottom:12px}.brand img{width:58px;height:58px;border-radius:50%;object-fit:cover;background:#fff}.brand small{display:block;opacity:.75}.nav button{width:100%;border:0;background:transparent;color:#fff;text-align:right;padding:12px;border-radius:9px;margin:3px 0}.nav button.active,.nav button:hover{background:#ffffff18}.main{margin-right:245px;width:calc(100% - 245px);padding:28px;max-width:1500px}.page{display:none}.page.active{display:block}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:20px}h1{margin:0}.muted{color:#71798a}.card{background:#fff;border:1px solid #e3e5eb;border-radius:14px;padding:20px;margin-bottom:16px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.num{font-size:25px;font-weight:700;margin-top:6px}.btn{border:0;border-radius:9px;padding:10px 14px;background:#242866;color:#fff}.gold{background:#b18b27}.light{background:#edf0f5;color:#20245f}.danger{background:#a83232}.actions{display:flex;gap:7px;flex-wrap:wrap}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px;border-bottom:1px solid #eee;text-align:right}.table th{background:#fafbfc}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}input,select,textarea{width:100%;padding:11px;border:1px solid #d6d9e2;border-radius:9px;background:#fff}textarea{min-height:90px}.full{grid-column:1/-1}.subcats{margin-top:18px;padding:15px;border:1px solid #e3e5eb;border-radius:12px;background:#f8f9fb}.unit{display:grid;grid-template-columns:1fr 1fr 1fr 1fr auto;gap:8px;align-items:end;margin-bottom:8px}.notice{background:#fff8df;border:1px solid #e4d27d;padding:12px;border-radius:9px;margin-bottom:15px}.empty{text-align:center;padding:30px;color:#777}@media(max-width:900px){.side{position:static;width:100%;height:auto}.app{display:block}.main{margin:0;width:100%}.cards{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.unit{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><img src="https://raw.githubusercontent.com/oun-a/alola-4/main/public/alola-logo.jpg"><div><b>الأولى</b><small>لإدارة الأملاك</small></div></div><div class="nav">
<button data-page="dashboard">🏠 الرئيسية</button><button data-page="properties">🏢 العقارات</button><button data-page="owners">👤 الملاك</button><button data-page="tenants">👥 المستأجرون</button><button data-page="receipts">🧾 سندات القبض</button><button data-page="disbursements">💸 سندات الصرف</button><button data-page="cash">💰 ذمة المكتب</button><button data-page="reports">📊 التقارير</button></div></aside>
<main class="main"><div class="notice"><b>ALOLA ERP:</b> البيانات في هذه النسخة تحفظ محلياً في المتصفح.</div><section id="dashboard" class="page"></section><section id="properties" class="page"></section><section id="owners" class="page"></section><section id="tenants" class="page"></section><section id="receipts" class="page"></section><section id="disbursements" class="page"></section><section id="cash" class="page"></section><section id="reports" class="page"></section></main></div>
<script>
const KEY='alola5_fixed_v2';let db;try{db=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){db=null}if(!db)db={owners:[],properties:[],tenants:[],receipts:[],disbursements:[],openingBalance:0};
const $=id=>document.getElementById(id),money=n=>Number(n||0).toLocaleString('ar-SA')+' ر.س',uid=p=>p+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const owner=id=>db.owners.find(x=>x.id===id)?.name||'—',prop=id=>db.properties.find(x=>x.id===id)?.name||'—',tenant=id=>db.tenants.find(x=>x.id===id)?.name||'—';
function save(){localStorage.setItem(KEY,JSON.stringify(db))}function show(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(p).classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render(p);window.scrollTo(0,0)}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.page));
function render(p){({dashboard:dashboardPage,properties:propertiesPage,owners:ownersPage,tenants:tenantsPage,receipts:receiptsPage,disbursements:disbursementsPage,cash:cashPage,reports:reportsPage}[p]||(()=>{}))()}
function dashboardPage(){let i=db.receipts.reduce((a,x)=>a+Number(x.amount||0),0),e=db.disbursements.reduce((a,x)=>a+Number(x.amount||0),0);$('dashboard').innerHTML=`<div class="top"><div><h1>لوحة التحكم</h1><div class="muted">الأولى لإدارة الأملاك</div></div></div><div class="cards"><div class="card">العقارات<div class="num">${db.properties.length}</div></div><div class="card">الملاك<div class="num">${db.owners.length}</div></div><div class="card">المستأجرون<div class="num">${db.tenants.length}</div></div><div class="card">صافي المكتب<div class="num">${money(Number(db.openingBalance||0)+i-e)}</div></div></div>`}
function propertiesPage(){$('properties').innerHTML=`<div class="top"><div><h1>العقارات</h1><div class="muted">العقارات والوحدات والتصنيفات الفرعية</div></div><button class="btn gold" onclick="propertyForm()">+ إضافة عقار</button></div><div class="card">${db.properties.length?`<table class="table"><tr><th>العقار</th><th>النوع</th><th>المالك</th><th>الوحدات</th><th>إجراءات</th></tr>${db.properties.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.type)}</td><td>${esc(owner(p.ownerId))}</td><td>${p.units?.length||0}</td><td class="actions"><button class="btn light" onclick="propertyForm('${p.id}')">تعديل</button><button class="btn danger" onclick="removeRecord('properties','${p.id}')">حذف</button></td></tr>`).join('')}</table>`:'<div class="empty">لا توجد عقارات</div>'}</div>`}
function unitRow(u={}){return `<div class="unit"><div><label>رقم/اسم الوحدة</label><input class="u-name" value="${esc(u.name||'')}"></div><div><label>النوع</label><select class="u-type">${['شقة','بوتيك','محل','مكتب','بدروم','مستودع','وحدة تجارية','أخرى'].map(x=>`<option ${u.type===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>الإيجار</label><input class="u-rent" type="number" value="${Number(u.rent||0)}"></div><div><label>الحالة</label><select class="u-status"><option ${u.status!=='مؤجر'?'selected':''}>متاح</option><option ${u.status==='مؤجر'?'selected':''}>مؤجر</option></select></div><button type="button" class="btn danger" onclick="this.parentElement.remove()">حذف</button></div>`}
function propertyForm(id=''){let p=db.properties.find(x=>x.id===id)||{name:'',type:'شقة',ownerId:'',status:'نشط',address:'',notes:'',units:[]};$('properties').innerHTML=`<div class="top"><div><h1>${id?'تعديل العقار':'إضافة عقار'}</h1><div class="muted">صفحة كاملة — ليست نافذة منبثقة</div></div><button class="btn light" onclick="show('properties')">رجوع</button></div><div class="card"><form id="propertyForm"><div class="formgrid"><div><label>اسم العقار</label><input name="name" required value="${esc(p.name)}"></div><div><label>نوع العقار</label><select name="type" id="ptype">${['شقة','فيلا','عمارة سكنية','مبنى تجاري','بوتيك','محل تجاري','بدروم','مكتب','أرض','مستودع','أخرى'].map(x=>`<option ${p.type===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>المالك</label><select name="ownerId"><option value="">اختر المالك</option>${db.owners.map(o=>`<option value="${o.id}" ${p.ownerId===o.id?'selected':''}>${esc(o.name)}</option>`).join('')}</select></div><div><label>الحالة</label><select name="status"><option>نشط</option><option ${p.status==='مغلق'?'selected':''}>مغلق</option></select></div><div class="full"><label>العنوان</label><input name="address" value="${esc(p.address)}"></div><div class="full"><label>ملاحظات</label><textarea name="notes">${esc(p.notes)}</textarea></div></div><div id="unitSection" class="subcats"><h3>الوحدات / التصنيفات الفرعية</h3><div class="muted">للعمارة أو المبنى: أضف شقة 101، شقة 102، بوتيك، محل، بدروم، مكتب... إلخ.</div><div id="units">${(p.units||[]).map(unitRow).join('')}</div><button type="button" class="btn light" onclick="$('units').insertAdjacentHTML('beforeend',unitRow())">+ إضافة وحدة</button></div><button class="btn gold" style="margin-top:18px">حفظ العقار</button></form></div>`;const toggle=()=>{$('unitSection').style.display=['عمارة سكنية','مبنى تجاري'].includes($('ptype').value)?'block':'none'};$('ptype').onchange=toggle;toggle();$('propertyForm').onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(e.target));x.units=[...document.querySelectorAll('#units .unit')].map(r=>({name:r.querySelector('.u-name').value,type:r.querySelector('.u-type').value,rent:Number(r.querySelector('.u-rent').value||0),status:r.querySelector('.u-status').value}));if(id)db.properties[db.properties.findIndex(z=>z.id===id)]={...p,...x,id};else db.properties.push({...x,id:uid('PROP')});save();show('properties')}}
function ownersPage(){$('owners').innerHTML=`<div class="top"><div><h1>الملاك</h1><div class="muted">إضافة وتعديل بيانات الملاك</div></div><button class="btn gold" onclick="ownerForm()">+ إضافة مالك</button></div><div class="card">${db.owners.length?`<table class="table"><tr><th>المالك</th><th>الهوية/السجل</th><th>الجوال</th><th>العقارات</th><th>إجراءات</th></tr>${db.owners.map(o=>`<tr><td>${esc(o.name)}</td><td>${esc(o.idNo)}</td><td>${esc(o.phone)}</td><td>${db.properties.filter(p=>p.ownerId===o.id).length}</td><td class="actions"><button class="btn light" onclick="ownerForm('${o.id}')">تعديل</button><button class="btn danger" onclick="removeRecord('owners','${o.id}')">حذف</button></td></tr>`).join('')}</table>`:'<div class="empty">لا يوجد ملاك</div>'}</div>`}
function ownerForm(id=''){let o=db.owners.find(x=>x.id===id)||{name:'',idNo:'',phone:'',email:'',notes:''};$('owners').innerHTML=`<div class="top"><div><h1>${id?'تعديل المالك':'إضافة مالك'}</h1><div class="muted">صفحة كاملة — ليست نافذة منبثقة</div></div><button class="btn light" onclick="show('owners')">رجوع</button></div><div class="card"><form id="ownerForm"><div class="formgrid"><div><label>اسم المالك</label><input name="name" required value="${esc(o.name)}"></div><div><label>رقم الهوية / السجل</label><input name="idNo" value="${esc(o.idNo)}"></div><div><label>رقم الجوال</label><input name="phone" value="${esc(o.phone)}"></div><div><label>البريد الإلكتروني</label><input name="email" value="${esc(o.email)}"></div><div class="full"><label>ملاحظات</label><textarea name="notes">${esc(o.notes)}</textarea></div></div><button class="btn gold" style="margin-top:18px">حفظ المالك</button></form></div>`;$('ownerForm').onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(e.target));if(id)db.owners[db.owners.findIndex(z=>z.id===id)]={...o,...x,id};else db.owners.push({...x,id:uid('OWN')});save();show('owners')}}
function tenantsPage(){$('tenants').innerHTML=`<div class="top"><h1>المستأجرون</h1><button class="btn gold" onclick="tenantForm()">+ إضافة مستأجر</button></div><div class="card">${db.tenants.length?`<table class="table"><tr><th>المستأجر</th><th>العقار</th><th>الوحدة</th><th>الإيجار</th><th>إجراءات</th></tr>${db.tenants.map(t=>`<tr><td>${esc(t.name)}</td><td>${esc(prop(t.propertyId))}</td><td>${esc(t.unit)}</td><td>${money(t.rent)}</td><td class="actions"><button class="btn light" onclick="tenantForm('${t.id}')">تعديل</button><button class="btn danger" onclick="removeRecord('tenants','${t.id}')">حذف</button></td></tr>`).join('')}</table>`:'<div class="empty">لا يوجد مستأجرون</div>'}</div>`}
function tenantForm(id=''){let t=db.tenants.find(x=>x.id===id)||{name:'',idNo:'',phone:'',propertyId:'',unit:'',rent:0};$('tenants').innerHTML=`<div class="top"><h1>${id?'تعديل المستأجر':'إضافة مستأجر'}</h1><button class="btn light" onclick="show('tenants')">رجوع</button></div><div class="card"><form id="tenantForm"><div class="formgrid"><div><label>اسم المستأجر</label><input name="name" required value="${esc(t.name)}"></div><div><label>الهوية / الإقامة</label><input name="idNo" value="${esc(t.idNo)}"></div><div><label>الجوال</label><input name="phone" value="${esc(t.phone)}"></div><div><label>العقار</label><select name="propertyId"><option value="">اختر</option>${db.properties.map(p=>`<option value="${p.id}" ${t.propertyId===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div><label>الوحدة</label><input name="unit" value="${esc(t.unit)}"></div><div><label>الإيجار الشهري</label><input name="rent" type="number" value="${Number(t.rent||0)}"></div></div><button class="btn gold" style="margin-top:18px">حفظ المستأجر</button></form></div>`;$('tenantForm').onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(e.target));x.rent=Number(x.rent||0);if(id)db.tenants[db.tenants.findIndex(z=>z.id===id)]={...t,...x,id};else db.tenants.push({...x,id:uid('TEN')});save();show('tenants')}}
function receiptsPage(){$('receipts').innerHTML=`<div class="top"><h1>سندات القبض</h1><button class="btn gold" onclick="receiptForm()">+ إنشاء سند قبض</button></div><div class="card">${db.receipts.length?`<table class="table"><tr><th>الرقم</th><th>المستأجر</th><th>العقار</th><th>المبلغ</th><th>إجراءات</th></tr>${db.receipts.map(r=>`<tr><td>${esc(r.no)}</td><td>${esc(tenant(r.tenantId))}</td><td>${esc(prop(r.propertyId))}</td><td>${money(r.amount)}</td><td class="actions"><button class="btn light" onclick="receiptForm('${r.id}')">تعديل</button><button class="btn danger" onclick="removeRecord('receipts','${r.id}')">حذف</button></td></tr>`).join('')}</table>`:'<div class="empty">لا توجد سندات قبض</div>'}</div>`}
function receiptForm(id=''){let r=db.receipts.find(x=>x.id===id)||{ownerId:'',propertyId:'',tenantId:'',amount:0,date:new Date().toISOString().slice(0,10),method:'تحويل بنكي',description:''};$('receipts').innerHTML=`<div class="top"><h1>${id?'تعديل سند قبض':'إنشاء سند قبض'}</h1><button class="btn light" onclick="show('receipts')">رجوع</button></div><div class="card"><form id="receiptForm"><div class="formgrid"><div><label>المالك</label><select name="ownerId">${db.owners.map(o=>`<option value="${o.id}" ${r.ownerId===o.id?'selected':''}>${esc(o.name)}</option>`).join('')}</select></div><div><label>العقار</label><select name="propertyId">${db.properties.map(p=>`<option value="${p.id}" ${r.propertyId===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div><label>المستأجر</label><select name="tenantId">${db.tenants.map(t=>`<option value="${t.id}" ${r.tenantId===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div><div><label>المبلغ</label><input name="amount" type="number" required value="${Number(r.amount||0)}"></div><div><label>التاريخ</label><input name="date" type="date" value="${r.date}"></div><div><label>طريقة الدفع</label><select name="method"><option>تحويل بنكي</option><option>نقداً</option><option>بطاقة</option><option>شيك</option></select></div><div class="full"><label>الوصف</label><textarea name="description">${esc(r.description)}</textarea></div></div><button class="btn gold" style="margin-top:18px">حفظ السند</button></form></div>`;$('receiptForm').onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(e.target));x.amount=Number(x.amount||0);if(id)db.receipts[db.receipts.findIndex(z=>z.id===id)]={...r,...x,id};else db.receipts.push({...x,id:uid('RC'),no:'RC-'+String(db.receipts.length+1).padStart(5,'0')});save();show('receipts')}}
function disbursementsPage(){$('disbursements').innerHTML=`<div class="top"><h1>سندات الصرف</h1><button class="btn gold" onclick="disbForm()">+ إنشاء سند صرف</button></div><div class="card">${db.disbursements.length?`<table class="table"><tr><th>الرقم</th><th>المالك</th><th>العقار</th><th>الفئة</th><th>المبلغ</th><th>إجراءات</th></tr>${db.disbursements.map(d=>`<tr><td>${esc(d.no)}</td><td>${esc(owner(d.ownerId))}</td><td>${esc(prop(d.propertyId))}</td><td>${esc(d.category)}</td><td>${money(d.amount)}</td><td class="actions"><button class="btn light" onclick="disbForm('${d.id}')">تعديل</button><button class="btn danger" onclick="removeRecord('disbursements','${d.id}')">حذف</button></td></tr>`).join('')}</table>`:'<div class="empty">لا توجد سندات صرف</div>'}</div>`}
function disbForm(id=''){let d=db.disbursements.find(x=>x.id===id)||{ownerId:'',propertyId:'',category:'صيانة',amount:0,date:new Date().toISOString().slice(0,10),description:''};$('disbursements').innerHTML=`<div class="top"><h1>${id?'تعديل سند صرف':'إنشاء سند صرف'}</h1><button class="btn light" onclick="show('disbursements')">رجوع</button></div><div class="card"><form id="disbForm"><div class="formgrid"><div><label>المالك</label><select name="ownerId">${db.owners.map(o=>`<option value="${o.id}" ${d.ownerId===o.id?'selected':''}>${esc(o.name)}</option>`).join('')}</select></div><div><label>العقار</label><select name="propertyId">${db.properties.map(p=>`<option value="${p.id}" ${d.propertyId===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div><label>الفئة</label><select name="category">${['صيانة','كهرباء','ماء','نظافة','عمولة','رسوم حكومية','أخرى'].map(x=>`<option ${d.category===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>المبلغ</label><input name="amount" type="number" required value="${Number(d.amount||0)}"></div><div><label>التاريخ</label><input name="date" type="date" value="${d.date}"></div><div class="full"><label>الوصف</label><textarea name="description">${esc(d.description)}</textarea></div></div><button class="btn gold" style="margin-top:18px">حفظ السند</button></form></div>`;$('disbForm').onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(e.target));x.amount=Number(x.amount||0);if(id)db.disbursements[db.disbursements.findIndex(z=>z.id===id)]={...d,...x,id};else db.disbursements.push({...x,id:uid('SD'),no:'SD-'+String(db.disbursements.length+1).padStart(5,'0')});save();show('disbursements')}}
function cashPage(){let i=db.receipts.reduce((a,x)=>a+Number(x.amount||0),0),e=db.disbursements.reduce((a,x)=>a+Number(x.amount||0),0);$('cash').innerHTML=`<div class="top"><h1>ذمة المكتب</h1></div><div class="cards"><div class="card">الرصيد الافتتاحي<div class="num">${money(db.openingBalance)}</div></div><div class="card">الدخل<div class="num">${money(i)}</div></div><div class="card">المصروفات<div class="num">${money(e)}</div></div><div class="card">الرصيد<div class="num">${money(Number(db.openingBalance||0)+i-e)}</div></div></div>`}
function reportsPage(){$('reports').innerHTML='<div class="top"><h1>التقارير</h1></div><div class="card">تقرير المالك = سندات القبض − سندات الصرف.</div>'}
function removeRecord(type,id){if(confirm('هل أنت متأكد من الحذف؟')){db[type]=db[type].filter(x=>x.id!==id);save();renderAll()}}
function renderAll(){dashboardPage();propertiesPage();ownersPage();tenantsPage();receiptsPage();disbursementsPage();cashPage();reportsPage()}
renderAll();show('dashboard');
</script></body></html>
