<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الأولى لإدارة الأملاك</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#f5f6f9;color:#18213a}.app{display:flex;min-height:100vh}.side{width:245px;position:fixed;right:0;top:0;bottom:0;background:#20245f;color:#fff;padding:18px;overflow:auto}.brand{display:flex;gap:10px;align-items:center;border-bottom:1px solid #ffffff25;padding-bottom:15px}.brand img{width:58px;height:58px;border-radius:50%;object-fit:cover;background:#fff}.brand small{display:block;opacity:.75}.nav{margin-top:14px}.nav button{width:100%;border:0;background:transparent;color:#fff;text-align:right;padding:12px;border-radius:9px;margin:3px 0;cursor:pointer}.nav button:hover,.nav button.active{background:#ffffff18}.main{margin-right:245px;width:calc(100% - 245px);padding:28px}.page{display:none}.page.active{display:block}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.card{background:#fff;border:1px solid #e3e5eb;border-radius:14px;padding:20px;margin-bottom:16px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.num{font-size:25px;font-weight:700;margin-top:6px}.muted{color:#71798a}.btn{border:0;border-radius:9px;padding:10px 14px;background:#242866;color:#fff;cursor:pointer}.gold{background:#b18b27}.light{background:#edf0f5;color:#20245f}.danger{background:#a83232}.actions{display:flex;gap:7px;flex-wrap:wrap}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid #eee;text-align:right}.table th{background:#fafbfc}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}input,select,textarea{width:100%;padding:11px;border:1px solid #d6d9e2;border-radius:9px;background:#fff}textarea{min-height:90px}.full{grid-column:1/-1}.subcats{margin-top:18px;padding:15px;border:1px solid #e3e5eb;border-radius:12px;background:#f8f9fb}.unit{display:grid;grid-template-columns:1fr 1fr 1fr 1fr auto;gap:8px;align-items:end;margin-bottom:8px}.notice{background:#fff8df;border:1px solid #e4d27d;padding:12px;border-radius:9px;margin-bottom:15px}.empty{text-align:center;padding:30px;color:#777}.doc{max-width:850px;margin:auto;background:#fff;border:1px solid #ddd;padding:35px}.docHead{display:flex;align-items:center;gap:18px;border-bottom:2px solid #20245f;padding-bottom:15px}.docHead img{width:90px;height:90px;border-radius:50%;object-fit:cover}.docTitle{text-align:center;flex:1}.doc table{width:100%;border-collapse:collapse;margin:20px 0}.doc th,.doc td{border:1px solid #ddd;padding:11px}.qr{width:130px;height:130px;object-fit:contain}.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat>div{background:#f8f9fb;border:1px solid #e3e5eb;padding:14px;border-radius:10px}@media(max-width:900px){.side{position:static;width:100%;height:auto}.app{display:block}.main{margin:0;width:100%}.cards,.formgrid,.stat{grid-template-columns:1fr}.full{grid-column:auto}.unit{grid-template-columns:1fr}}@media print{.side,.top,.notice{display:none!important}.main{margin:0;width:100%;padding:0}.page{display:none!important}.page.printing{display:block!important}.doc{border:0}}</style></head><body><div class="app"><aside class="side"><div class="brand"><img src="https://raw.githubusercontent.com/oun-a/alola-4/main/public/alola-logo.jpg"><div><b>الأولى</b><small>لإدارة الأملاك</small></div></div><div id="nav" class="nav"></div></aside><main class="main"><div class="notice"><b>ALOLA ERP:</b> البيانات تحفظ محلياً في هذا المتصفح في هذه النسخة.</div><section id="dashboard" class="page"></section><section id="properties" class="page"></section><section id="owners" class="page"></section><section id="tenants" class="page"></section><section id="receipts" class="page"></section><section id="disbursements" class="page"></section><section id="cash" class="page"></section><section id="reports" class="page"></section><section id="doc" class="page"></section></main></div><script>const K='alola5_v4';let db=JSON.parse(localStorage.getItem(K)||'null')||{owners:[],properties:[],tenants:[],receipts:[],disbursements:[],openingBalance:0};const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),money=n=>Number(n||0).toLocaleString('ar-SA')+' ر.س',uid=p=>p+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),save=()=>localStorage.setItem(K,JSON.stringify(db));const owner=id=>db.owners.find(x=>x.id===id)?.name||'—',prop=id=>db.properties.find(x=>x.id===id)?.name||'—',tenant=id=>db.tenants.find(x=>x.id===id)?.name||'—';const pages=[['dashboard','🏠 الرئيسية'],['properties','🏢 العقارات'],['owners','👤 الملاك'],['tenants','👥 المستأجرون'],['receipts','🧾 سندات القبض'],['disbursements','💸 سندات الصرف'],['cash','💰 ذمة المكتب'],['reports','📊 التقارير']];$('nav').innerHTML=pages.map(x=>`<button data-p="${x[0]}">${x[1]}</button>`).join('');document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>show(b.dataset.p));function show(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active','printing'));$(p).classList.add('active');document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.p===p));render(p);scrollTo(0,0)}function render(p){({dashboard:dash,properties:props,owners:owners,tenants:tenants,receipts:receipts,disbursements:disbs,cash:cash,reports:reports}[p]||(()=>{}))()}function del(t,id){if(confirm('هل أنت متأكد من الحذف؟')){db[t]=db[t].filter(x=>x.id!==id);save();renderAll()}}function next(prefix,a){let n=a.reduce((m,x)=>Math.max(m,Number(String(x.no||'').split('-').pop())||0),0)+1;return prefix+'-'+String(n).padStart(5,'0')}function dash(){let i=db.receipts.reduce((a,x)=>a+ +x.amount,0),e=db.disbursements.reduce((a,x)=>a+ +x.amount,0),u=db.properties.reduce((a,p)=>a+(p.units?.length||1),0);$('dashboard').innerHTML=`<div class="top"><div><h1>لوحة التحكم</h1><div class="muted">الأولى لإدارة الأملاك</div></div></div><div class="cards"><div class="card">العقارات<div class="num">${db.properties.length}</div></div><div class="card">الوحدات<div class="num">${u}</div></div><div class="card">المستأجرون<div class="num">${db.tenants.length}</div></div><div class="card">صافي الحركة<div class="num">${money(i-e)}</div></div></div>`}function owners(){let rows=db.owners.map(o=>{let i=db.receipts.filter(r=>r.ownerId===o.id).reduce((a,r)=>a+ +r.amount,0),e=db.disbursements.filter(d=>d.ownerId===o.id).reduce((a,d)=>a+ +d.amount,0);return `<tr><td>${esc(o.name)}</td><td>${db.properties.filter(p=>p.ownerId===o.id).length}</td><td>${money(i)}</td><td>${money(e)}</td><td>${money(i-e)}</td><td class="actions"><button class="btn light" onclick="ownerForm('${o.id}')">تعديل</button><button class="btn danger" onclick="del('owners','${o.id}')">حذف</button></td></tr>`}).join('');$('owners').innerHTML=`<div class="top"><div><h1>الملاك</h1><div class="muted">ملف مستقل لكل مالك</div></div><button class="btn gold" onclick="ownerForm()">+ إضافة مالك</button></div><div class="card">${rows?`<table class="table"><tr><th>المالك</th><th>العقارات</th><th>القبض</th><th>الصرف</th><th>الصافي</th><th>إجراءات</th></tr>${rows}</table>`:'<div class="empty">لا يوجد ملاك</div>'}</div>`}function ownerForm(id=''){let o=db.owners.find(x=>x.id===id)||{};$('owners').innerHTML=`<div class="top"><h1>${id?'تعديل المالك':'إضافة مالك'}</h1><button class="btn light" onclick="show('owners')">رجوع</button></div><div class="card"><form id="of"><div class="formgrid"><div><label>اسم المالك</label><input name="name" required value="${esc(o.name)}"></div><div><label>الهوية / السجل</label><input name="idNo" value="${esc(o.idNo)}"></div><div><label>الجوال</label><input name="phone" value="${esc(o.phone)}"></div><div><label>البريد</label><input name="email" value="${esc(o.email)}"></div><div><label>البنك</label><input name="bank" value="${esc(o.bank)}"></div><div><label>IBAN</label><input name="iban" value="${esc(o.iban)}"></div><div class="full"><label>ملاحظات</label><textarea name="notes">${esc(o.notes)}</textarea></div></div><button class="btn gold" style="margin-top:15px">حفظ</button></form></div>`;$('of').onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(e.target));if(id)Object.assign(o,x);else db.owners.push({...x,id:uid('OWN')});save();show('owners')}}function unitRow(u={}){return `<div class="unit"><div><label>اسم/رقم الوحدة</label><input class="un" value="${esc(u.name)}"></div><div><label>النوع</label><select class="ut">${['شقة','بوتيك','محل','مكتب','بدروم','مستودع','أخرى'].map(x=>`<option ${u.type===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>الإيجار</label><input class="ur" type="number" value="${u.rent||0}"></div><div><label>الحالة</label><select class="us"><option ${u.status!=='مؤجر'?'selected':''}>متاح</option><option ${u.status==='مؤجر'?'selected':''}>مؤجر</option></select></div><button type="button" class="btn danger" onclick="this.parentElement.remove()">حذف</button></div>`}function props(){let rows=db.properties.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.type)}</td><td>${esc(owner(p.ownerId))}</td><td>${p.units?.length||0}</td><td class="actions"><button class="btn light" onclick="propForm('${p.id}')">تعديل</button><button class="btn danger" onclick="del('properties','${p.id}')">حذف</button></td></tr>`).join('');$('properties').innerHTML=`<div class="top"><div><h1>العقارات</h1><div class="muted">العقارات والوحدات الفرعية</div></div><button class="btn gold" onclick="propForm()">+ إضافة عقار</button></div><div class="card">${rows?`<table class="table"><tr><th>العقار</th><th>النوع</th><th>المالك</th><th>الوحدات</th><th>إجراءات</th></tr>${rows}</table>`:'<div class="empty">لا توجد عقارات</div>'}</div>`}function propForm(id=''){let p=db.properties.find(x=>x.id===id)||{type:'شقة',units:[]};$('properties').innerHTML=`<div class="top"><h1>${id?'تعديل العقار':'إضافة عقار'}</h1><button class="btn light" onclick="show('properties')">رجوع</button></div><div class="card"><form id="pf"><div class="formgrid"><div><label>اسم العقار</label><input name="name" required value="${esc(p.name)}"></div><div><label>نوع العقار</label><select name="type" id="pt">${['شقة','فيلا','عمارة سكنية','مبنى تجاري','بوتيك','محل تجاري','بدروم','مكتب','أرض','مستودع','أخرى'].map(x=>`<option ${p.type===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>المالك</label><select name="ownerId"><option value="">اختر المالك</option>${db.owners.map(o=>`<option value="${o.id}" ${p.ownerId===o.id?'selected':''}>${esc(o.name)}</option>`).join('')}</select></div><div><label>الحالة</label><select name="status"><option>نشط</option><option ${p.status==='مغلق'?'selected':''}>مغلق</option></select></div><div class="full"><label>العنوان</label><input name="address" value="${esc(p.address)}"></div></div><div id="ub" class="subcats"><h3>الوحدات / التصنيفات الفرعية</h3><div class="muted">مثال: شقة 101، شقة 102، بوتيك، محل، بدروم، مكتب.</div><div id="units">${(p.units||[]).map(unitRow).join('')}</div><button type="button" class="btn light" onclick="$('units').insertAdjacentHTML('beforeend',unitRow())">+ إضافة وحدة</button></div><button class="btn gold" style="margin-top:15px">حفظ</button></form></div>`;let tog=()=>$('ub').style.display=['عمارة سكنية','مبنى تجاري'].includes($('pt').value)?'block':'none';$('pt').onchange=tog;tog();$('pf').onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(e.target));x.units=[...document.querySelectorAll('.unit')].map(r=>({name:r.querySelector('.un').value,type:r.querySelector('.ut').value,rent:+r.querySelector('.ur').value||0,status:r.querySelector('.us').value}));if(id)Object.assign(p,x);else db.properties.push({...x,id:uid('PROP')});save();show('properties')}}function tenants(){let rows=db.tenants.map(t=>{let paid=db.receipts.filter(r=>r.tenantId===t.id).reduce((a,r)=>a+ +r.amount,0);return `<tr><td>${esc(t.name)}</td><td>${esc(prop(t.propertyId))} / ${esc(t.unit||'—')}</td><td>${money(t.rent)}</td><td>${money(paid)}</td><td>${money(Math.max(0,+t.rent-paid))}</td><td class="actions"><button class="btn light" onclick="tenantForm('${t.id}')">تعديل</button><button class="btn danger" onclick="del('tenants','${t.id}')">حذف</button></td></tr>`}).join('');$('tenants').innerHTML=`<div class="top"><div><h1>المستأجرون</h1><div class="muted">ملف مالي لكل مستأجر</div></div><button class="btn gold" onclick="tenantForm()">+ إضافة مستأجر</button></div><div class="card">${rows?`<table class="table"><tr><th>المستأجر</th><th>العقار/الوحدة</th><th>الإيجار</th><th>المدفوع</th><th>المتبقي</th><th>إجراءات</th></tr>${rows}</table>`:'<div class="empty">لا يوجد مستأجرون</div>'}</div>`}function tenantForm(id=''){let t=db.tenants.find(x=>x.id===id)||{};$('tenants').innerHTML=`<div class="top"><h1>${id?'تعديل المستأجر':'إضافة مستأجر'}</h1><button class="btn light" onclick="show('tenants')">رجوع</button></div><div class="card"><form id="tf"><div class="formgrid"><div><label>الاسم</label><input name="name" required value="${esc(t.name)}"></div><div><label>الهوية/الإقامة</label><input name="idNo" value="${esc(t.idNo)}"></div><div><label>الجوال</label><input name="phone" value="${esc(t.phone)}"></div><div><label>العقار</label><select name="propertyId">${db.properties.map(p=>`<option value="${p.id}" ${t.propertyId===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div><label>الوحدة</label><input name="unit" value="${esc(t.unit)}"></div><div><label>الإيجار الشهري</label><input name="rent" type="number" value="${t.rent||0}"></div><div><label>رقم العقد</label><input name="contractNo" value="${esc(t.contractNo)}"></div><div><label>نهاية العقد</label><input name="contractEnd" type="date" value="${esc(t.contractEnd)}"></div></div><button class="btn gold" style="margin-top:15px">حفظ</button></form></div>`;$('tf').onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(e.target));x.rent=+x.rent||0;if(id)Object.assign(t,x);else db.tenants.push({...x,id:uid('TEN')});save();show('tenants')}}function receiptForm(id=''){let r=db.receipts.find(x=>x.id===id)||{date:new Date().toISOString().slice(0,10),method:'تحويل بنكي'};$('receipts').innerHTML=`<div class="top"><h1>${id?'تعديل سند قبض':'إنشاء سند قبض'}</h1><button class="btn light" onclick="show('receipts')">رجوع</button></div><div class="card"><form id="rf"><div class="formgrid"><div><label>المالك</label><select name="ownerId">${db.owners.map(o=>`<option value="${o.id}" ${r.ownerId===o.id?'selected':''}>${esc(o.name)}</option>`).join('')}</select></div><div><label>العقار</label><select name="propertyId">${db.properties.map(p=>`<option value="${p.id}" ${r.propertyId===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div><label>المستأجر</label><select name="tenantId">${db.tenants.map(t=>`<option value="${t.id}" ${r.tenantId===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div><div><label>الوحدة</label><input name="unit" value="${esc(r.unit)}"></div><div><label>المبلغ</label><input name="amount" type="number" required value="${r.amount||''}"></div><div><label>التاريخ</label><input name="date" type="date" value="${r.date}"></div><div><label>طريقة الدفع</label><select name="method"><option>تحويل بنكي</option><option>نقداً</option><option>بطاقة</option><option>شيك</option></select></div><div class="full"><label>الوصف</label><textarea name="description">${esc(r.description)}</textarea></div></div><button class="btn gold" style="margin-top:15px">حفظ</button></form></div>`;$('rf').onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(e.target));x.amount=+x.amount||0;if(id)Object.assign(r,x);else db.receipts.push({...x,id:uid('RC'),no:next('RC',db.receipts)});save();show('receipts')}}function receipts(){let rows=db.receipts.slice().reverse().map(r=>`<tr><td>${r.no}</td><td>${esc(tenant(r.tenantId))}</td><td>${money(r.amount)}</td><td>${r.date}</td><td class="actions"><button class="btn light" onclick="receiptForm('${r.id}')">تعديل</button><button class="btn" onclick="printDoc('سند قبض','${r.id}')">طباعة</button><button class="btn danger" onclick="del('receipts','${r.id}')">حذف</button></td></tr>`).join('');$('receipts').innerHTML=`<div class="top"><h1>سندات القبض</h1><button class="btn gold" onclick="receiptForm()">+ إنشاء سند قبض</button></div><div class="card">${rows?`<table class="table"><tr><th>الرقم</th><th>المستأجر</th><th>المبلغ</th><th>التاريخ</th><th>إجراءات</th></tr>${rows}</table>`:'<div class="empty">لا توجد سندات</div>'}</div>`}function disbForm(id=''){let d=db.disbursements.find(x=>x.id===id)||{date:new Date().toISOString().slice(0,10),category:'صيانة'};$('disbursements').innerHTML=`<div class="top"><h1>${id?'تعديل سند صرف':'إنشاء سند صرف'}</h1><button class="btn light" onclick="show('disbursements')">رجوع</button></div><div class="card"><form id="df"><div class="formgrid"><div><label>المالك</label><select name="ownerId">${db.owners.map(o=>`<option value="${o.id}" ${d.ownerId===o.id?'selected':''}>${esc(o.name)}</option>`).join('')}</select></div><div><label>العقار</label><select name="propertyId">${db.properties.map(p=>`<option value="${p.id}" ${d.propertyId===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div><label>الوحدة</label><input name="unit" value="${esc(d.unit)}"></div><div><label>الفئة</label><select name="category">${['صيانة','كهرباء','ماء','نظافة','رسوم','أخرى'].map(x=>`<option ${d.category===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>المبلغ</label><input name="amount" type="number" required value="${d.amount||''}"></div><div><label>التاريخ</label><input name="date" type="date" value="${d.date}"></div><div class="full"><label>الوصف</label><textarea name="description">${esc(d.description)}</textarea></div><div class="full"><label>الفاتورة / المرفق</label><input id="file" type="file" accept=".pdf,.jpg,.jpeg,.png"></div></div><button class="btn gold" style="margin-top:15px">حفظ</button></form></div>`;$('df').onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(e.target)),f=$('file').files[0];x.amount=+x.amount||0;x.attachment=f?f.name:(d.attachment||'');if(id)Object.assign(d,x);else db.disbursements.push({...x,id:uid('SD'),no:next('SD',db.disbursements)});save();show('disbursements')}}function disbs(){let rows=db.disbursements.slice().reverse().map(d=>`<tr><td>${d.no}</td><td>${esc(owner(d.ownerId))}</td><td>${esc(prop(d.propertyId))}</td><td>${esc(d.category)}</td><td>${money(d.amount)}</td><td class="actions"><button class="btn light" onclick="disbForm('${d.id}')">تعديل</button><button class="btn" onclick="printDoc('سند صرف','${d.id}')">طباعة</button><button class="btn danger" onclick="del('disbursements','${d.id}')">حذف</button></td></tr>`).join('');$('disbursements').innerHTML=`<div class="top"><h1>سندات الصرف</h1><button class="btn gold" onclick="disbForm()">+ إنشاء سند صرف</button></div><div class="card">${rows?`<table class="table"><tr><th>الرقم</th><th>المالك</th><th>العقار</th><th>الفئة</th><th>المبلغ</th><th>إجراءات</th></tr>${rows}</table>`:'<div class="empty">لا توجد سندات</div>'}</div>`}function cash(){let i=db.receipts.reduce((a,r)=>a+ +r.amount,0),e=db.disbursements.reduce((a,d)=>a+ +d.amount,0);$('cash').innerHTML=`<div class="top"><h1>الذمة المالية للمكتب</h1></div><div class="cards"><div class="card">الرصيد الافتتاحي<div class="num">${money(db.openingBalance)}</div></div><div class="card">الدخل<div class="num">${money(i)}</div></div><div class="card">المصروفات<div class="num">${money(e)}</div></div><div class="card">الرصيد الختامي<div class="num">${money(+db.openingBalance+i-e)}</div></div></div><div class="card"><label>تعديل الرصيد الافتتاحي</label><input type="number" value="${db.openingBalance}" onchange="db.openingBalance=+this.value||0;save();cash()"></div>`}function reports(){let rows=db.owners.map(o=>{let i=db.receipts.filter(r=>r.ownerId===o.id).reduce((a,r)=>a+ +r.amount,0),e=db.disbursements.filter(d=>d.ownerId===o.id).reduce((a,d)=>a+ +d.amount,0);return `<tr><td>${esc(o.name)}</td><td>${money(i)}</td><td>${money(e)}</td><td>${money(i-e)}</td></tr>`}).join('');$('reports').innerHTML=`<div class="top"><h1>التقارير</h1></div><div class="card"><h3>تقرير الملاك</h3>${rows?`<table class="table"><tr><th>المالك</th><th>القبض</th><th>الصرف</th><th>صافي التحويل</th></tr>${rows}</table>`:'<div class="empty">لا توجد بيانات</div>'}</div>`}function printDoc(type,id){let x=type==='سند قبض'?db.receipts.find(r=>r.id===id):db.disbursements.find(d=>d.id===id);$('doc').innerHTML=`<div class="top"><h1>${x.no}</h1><div><button class="btn gold" onclick="doPrint()">طباعة / PDF</button><button class="btn light" onclick="show(type==='سند قبض'?'receipts':'disbursements')">رجوع</button></div></div><div class="doc"><div class="docHead"><img src="https://raw.githubusercontent.com/oun-a/alola-4/main/public/alola-logo.jpg"><div class="docTitle"><h2>${type}</h2><b>الأولى لإدارة الأملاك</b><div>${x.no}</div></div></div><table><tr><th>المالك</th><td>${esc(owner(x.ownerId))}</td></tr><tr><th>العقار</th><td>${esc(prop(x.propertyId))}</td></tr><tr><th>الوحدة</th><td>${esc(x.unit||'—')}</td></tr><tr><th>التاريخ</th><td>${x.date}</td></tr><tr><th>المبلغ</th><td>${money(x.amount)}</td></tr><tr><th>الوصف</th><td>${esc(x.description||'—')}</td></tr></table><div style="text-align:left"><img class="qr" src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=MECARD%3AN%3A%D8%A7%D9%84%D8%A3%D9%88%D9%84%D9%89%20%D9%84%D8%A5%D8%AF%D8%A7%D8%B1%D8%A9%20%D8%A7%D9%84%D8%A3%D9%85%D9%84%D8%A7%D9%83%3BTEL%3A0570376617%3BEMAIL%3Aalolapm%40gmail.com%3B%3B"></div></div>`;show('doc')}function doPrint(){$('doc').classList.add('printing');window.print();setTimeout(()=>$('doc').classList.remove('printing'),400)}function renderAll(){dash();props();owners();tenants();receipts();disbs();cash();reports()}renderAll();show('dashboard');</script></body></html>
