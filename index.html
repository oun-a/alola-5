<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الأولى لإدارة الأملاك — ALOLA ERP</title><style>*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Tahoma,Arial,sans-serif;background:#f4f5f8;color:#172033}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.side{width:245px;background:#20245f;color:#fff;padding:18px;position:fixed;right:0;top:0;bottom:0;overflow:auto}.brand{display:flex;align-items:center;gap:10px;padding:5px 4px 18px;border-bottom:1px solid #ffffff25}.brand img{width:52px;height:52px;border-radius:50%;object-fit:cover;background:#fff}.brand b{font-size:18px}.brand small{display:block;opacity:.7;margin-top:3px}.nav{margin-top:14px}.nav button{display:block;width:100%;border:0;background:transparent;color:#fff;text-align:right;padding:11px 12px;border-radius:9px;margin:3px 0}.nav button:hover,.nav button.active{background:#ffffff18}.main{margin-right:245px;padding:28px;max-width:1500px;width:100%}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:20px}h1{margin:0;font-size:27px}.muted{color:#6c7484}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:18px}.card{background:#fff;border:1px solid #e5e7ed;border-radius:14px;padding:17px;box-shadow:0 2px 8px #1720330a;margin-bottom:16px}.num{font-size:26px;font-weight:700;margin-top:7px}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #eee;text-align:right}.badge{display:inline-block;padding:4px 8px;border-radius:18px;background:#eef1ff;color:#303a87;font-size:12px}.btn{border:0;border-radius:9px;padding:10px 14px;background:#242867;color:#fff}.btn.gold{background:#b8952e}.btn.light{background:#edf0f5;color:#20245f}.btn.danger{background:#9d3030}.actions{display:flex;gap:8px;flex-wrap:wrap}.page{display:none}.page.active{display:block}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}label{display:block;font-weight:600;font-size:13px;margin-bottom:5px}input,select,textarea{width:100%;border:1px solid #d7dae3;border-radius:8px;padding:10px;background:#fff}textarea{min-height:90px}.full{grid-column:1/-1}.notice{background:#fff8dc;border:1px solid #e5d27e;padding:11px 13px;border-radius:9px;margin-bottom:15px}.doc{background:#fff;max-width:850px;margin:auto;padding:38px;border:1px solid #ddd}.dochead{display:flex;align-items:center;gap:20px;border-bottom:2px solid #20245f;padding-bottom:15px}.dochead img{width:100px;height:100px;object-fit:cover;border-radius:50%}.doctitle{text-align:center;flex:1}.doctable{width:100%;border-collapse:collapse;margin:20px 0}.doctable td,.doctable th{border:1px solid #ddd;padding:10px}.qr{width:120px;height:120px;object-fit:contain}.no-print{display:block}@media(max-width:900px){.side{position:static;width:100%;height:auto}.app{display:block}.main{margin:0}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}}@media print{body{background:#fff}.side,.top,.no-print{display:none!important}.main{margin:0;padding:0}.page{display:none!important}.page.printing{display:block!important}.doc{border:0;box-shadow:none;max-width:none;padding:10mm}}</style></head><body><div class="app"><aside class="side"><div class="brand"><img id="logo"><div><b>الأولى</b><small>لإدارة الأملاك</small></div></div><div class="nav" id="nav"></div></aside><main class="main"><div class="notice no-print"><b>نسخة تشغيلية:</b> البيانات تحفظ في هذا المتصفح تلقائياً. يمكنك إنشاء وتعديل وحذف السجلات وطباعة السندات. للتشغيل السحابي بقاعدة بيانات حقيقية، اربط المشروع لاحقاً بـ MongoDB/Supabase.</div><section id="dashboard" class="page active"></section><section id="properties" class="page"></section><section id="owners" class="page"></section><section id="tenants" class="page"></section><section id="receipts" class="page"></section><section id="disbursements" class="page"></section><section id="cash" class="page"></section><section id="reports" class="page"></section><section id="receiptForm" class="page"></section><section id="disbursementForm" class="page"></section><section id="receiptDoc" class="page"></section><section id="disbursementDoc" class="page"></section></main></div><script>
const LOGO='data:image/jpeg;base64," + logo + "';const QR='data:image/jpeg;base64," + qr + "';document.getElementById('logo').src=LOGO;const key='alola_erp_v1';let db=JSON.parse(localStorage.getItem(key)||'null')||{owners:[{id:'o1',name:'أحمد محمد'}],properties:[{id:'p1',name:'عمارة النخيل',type:'عمارة سكنية',ownerId:'o1',units:['شقة 1','شقة 2','شقة 3','شقة 4']}],tenants:[{id:'t1',name:'محمد أحمد',ownerId:'o1',propertyId:'p1',unit:'شقة 4',rent:1000}],receipts:[{id:'r1',no:'RC-0001',tenantId:'t1',ownerId:'o1',propertyId:'p1',unit:'شقة 4',amount:100,date:'2026-08-17',method:'تحويل بنكي',description:'دفعة من إيجار الوحدة'}],disbursements:[{id:'d1',no:'SD-0001',ownerId:'o1',propertyId:'p1',amount:200,date:'2026-08-17',method:'تحويل بنكي',category:'صيانة',description:'صيانة دورية',attachment:''}],openingBalance:0};function save(){localStorage.setItem(key,JSON.stringify(db))}function id(){return Math.random().toString(36).slice(2)+Date.now()}function money(n){return Number(n||0).toLocaleString('ar-SA')+' ر.س'}function owner(id){return db.owners.find(x=>x.id===id)?.name||'—'}function prop(id){return db.properties.find(x=>x.id===id)?.name||'—'}function tenant(id){return db.tenants.find(x=>x.id===id)?.name||'—'}function next(p,a){return p+'-'+String(a.length+1).padStart(4,'0')}const pages=[['dashboard','🏠 الرئيسية'],['properties','🏢 العقارات'],['owners','👤 الملاك'],['tenants','👥 المستأجرون'],['receipts','🧾 سندات القبض'],['disbursements','💸 سندات الصرف'],['cash','💰 ذمة المكتب'],['reports','📊 التقارير']];document.getElementById('nav').innerHTML=pages.map(x=>`<button data-page="${x[0]}">${x[1]}</button>`).join('');document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>show(b.dataset.page));function show(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active','printing'));document.getElementById(p).classList.add('active');document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===p));render(p);scrollTo(0,0)}function render(p){({dashboard,properties,owners,tenants,receipts,disbursements,cash,reports,receiptForm,disbursementForm}[p]||(()=>{}))()}function dashboard(){let i=db.receipts.reduce((a,x)=>a+Number(x.amount),0),e=db.disbursements.reduce((a,x)=>a+Number(x.amount),0);document.getElementById('dashboard').innerHTML=`<div class="top"><div><h1>لوحة التحكم</h1><div class="muted">الأولى لإدارة الأملاك</div></div><div><button class="btn gold" onclick="show('receiptForm')">+ سند قبض</button> <button class="btn" onclick="show('disbursementForm')">+ سند صرف</button></div></div><div class="cards"><div class="card"><div class="muted">العقارات</div><div class="num">${db.properties.length}</div></div><div class="card"><div class="muted">المستأجرون</div><div class="num">${db.tenants.length}</div></div><div class="card"><div class="muted">إيرادات</div><div class="num">${money(i)}</div></div><div class="card"><div class="muted">مصروفات</div><div class="num">${money(e)}</div></div></div><div class="card"><h3>صافي المكتب</h3><div class="num">${money(Number(db.openingBalance)+i-e)}</div></div>`}function properties(){document.getElementById('properties').innerHTML=`<div class="top"><h1>العقارات</h1><button class="btn gold" onclick="addProperty()">+ إضافة عقار</button></div><div class="card"><table class="table"><tr><th>العقار</th><th>النوع</th><th>المالك</th><th>الوحدات</th><th></th></tr>${db.properties.map(p=>`<tr><td>${p.name}</td><td>${p.type}</td><td>${owner(p.ownerId)}</td><td>${p.units?.length||0}</td><td><button class="btn light" onclick="deleteProperty('${p.id}')">حذف</button></td></tr>`).join('')}</table></div>`}function addProperty(){let n=prompt('اسم العقار');if(!n)return;db.properties.push({id:id(),name:n,type:prompt('نوع العقار','عمارة سكنية')||'',ownerId:db.owners[0]?.id||'',units:[]});save();properties()}function deleteProperty(x){if(confirm('حذف العقار؟')){db.properties=db.properties.filter(p=>p.id!==x);save();properties()}}function owners(){document.getElementById('owners').innerHTML=`<div class="top"><h1>الملاك</h1><button class="btn gold" onclick="addOwner()">+ إضافة مالك</button></div><div class="card"><table class="table"><tr><th>المالك</th><th>العقارات</th><th>القبض</th><th>الصرف</th><th>الصافي</th></tr>${db.owners.map(o=>{let i=db.receipts.filter(r=>r.ownerId===o.id).reduce((a,x)=>a+Number(x.amount),0),e=db.disbursements.filter(r=>r.ownerId===o.id).reduce((a,x)=>a+Number(x.amount),0);return `<tr><td>${o.name}</td><td>${db.properties.filter(p=>p.ownerId===o.id).length}</td><td>${money(i)}</td><td>${money(e)}</td><td><b>${money(i-e)}</b></td></tr>`}).join('')}</table></div>`}function addOwner(){let n=prompt('اسم المالك');if(n){db.owners.push({id:id(),name:n});save();owners()}}function tenants(){document.getElementById('tenants').innerHTML=`<div class="top"><h1>المستأجرون</h1><button class="btn gold" onclick="addTenant()">+ إضافة مستأجر</button></div><div class="card"><table class="table"><tr><th>المستأجر</th><th>العقار</th><th>الإيجار</th><th>المدفوع</th><th>المتبقي</th></tr>${db.tenants.map(t=>{let p=db.receipts.filter(r=>r.tenantId===t.id).reduce((a,x)=>a+Number(x.amount),0);return `<tr><td>${t.name}</td><td>${prop(t.propertyId)} / ${t.unit||'—'}</td><td>${money(t.rent)}</td><td>${money(p)}</td><td><b>${money(Math.max(0,t.rent-p))}</b></td></tr>`}).join('')}</table></div>`}function addTenant(){let n=prompt('اسم المستأجر');if(n){db.tenants.push({id:id(),name:n,rent:Number(prompt('الإيجار الشهري','1000')||0),ownerId:db.owners[0]?.id||'',propertyId:db.properties[0]?.id||'',unit:''});save();tenants()}}function receiptTable(a){return `<table class="table"><tr><th>الرقم</th><th>المستأجر</th><th>المبلغ</th><th></th></tr>${a.map(r=>`<tr><td>${r.no}</td><td>${tenant(r.tenantId)}</td><td>${money(r.amount)}</td><td><button class="btn light" onclick="openReceipt('${r.id}')">فتح</button></td></tr>`).join('')}</table>`}function receipts(){document.getElementById('receipts').innerHTML=`<div class="top"><h1>سندات القبض</h1><button class="btn gold" onclick="show('receiptForm')">+ إنشاء سند قبض</button></div><div class="card">${receiptTable(db.receipts.slice().reverse())}</div>`}function receiptForm(){document.getElementById('receiptForm').innerHTML=`<div class="top"><h1>إنشاء سند قبض</h1><button class="btn light" onclick="show('receipts')">رجوع</button></div><div class="card"><div class="formgrid"><div><label>المالك</label><select id="rf_owner">${db.owners.map(o=>`<option value="${o.id}">${o.name}</option>`).join('')}</select></div><div><label>العقار</label><select id="rf_prop">${db.properties.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select></div><div><label>المستأجر</label><select id="rf_tenant">${db.tenants.map(t=>`<option value="${t.id}">${t.name}</option>`).join('')}</select></div><div><label>المبلغ</label><input id="rf_amount" type="number" min="0"></div><div><label>التاريخ</label><input id="rf_date" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div><label>طريقة الدفع</label><select id="rf_method"><option>تحويل بنكي</option><option>نقداً</option><option>بطاقة</option><option>شيك</option></select></div><div class="full"><label>الوصف</label><textarea id="rf_desc">دفعة من الإيجار</textarea></div><div class="full"><button class="btn gold" onclick="saveReceipt()">حفظ وفتح السند</button></div></div></div>`}function saveReceipt(){let t=document.getElementById('rf_tenant').value,tt=db.tenants.find(x=>x.id===t),r={id:id(),no:next('RC',db.receipts),tenantId:t,ownerId:document.getElementById('rf_owner').value,propertyId:document.getElementById('rf_prop').value,unit:tt?.unit||'',amount:Number(document.getElementById('rf_amount').value||0),date:document.getElementById('rf_date').value,method:document.getElementById('rf_method').value,description:document.getElementById('rf_desc').value};db.receipts.push(r);save();openReceipt(r.id)}function openReceipt(x){window.currentReceipt=db.receipts.find(r=>r.id===x);receiptDoc(window.currentReceipt)}function receiptDoc(r){document.getElementById('receiptDoc').innerHTML=`<div class="top no-print"><h1>${r.no}</h1><div><button class="btn gold" onclick="printDoc('receiptDoc')">طباعة / PDF</button> <button class="btn light" onclick="show('receipts')">رجوع</button></div></div><div class="doc"><div class="dochead"><img src="${LOGO}"><div class="doctitle"><h2>سند قبض</h2><b>الأولى لإدارة الأملاك</b><div>رقم السند: ${r.no}</div></div></div><table class="doctable"><tr><th>المالك</th><td>${owner(r.ownerId)}</td><th>التاريخ</th><td>${r.date}</td></tr><tr><th>المستأجر</th><td>${tenant(r.tenantId)}</td><th>طريقة الدفع</th><td>${r.method}</td></tr><tr><th>العقار</th><td>${prop(r.propertyId)}</td><th>الوحدة</th><td>${r.unit||'—'}</td></tr><tr><th>المبلغ</th><td colspan="3"><b>${money(r.amount)}</b></td></tr></table><p><b>الوصف:</b> ${r.description||''}</p><div style="text-align:left"><img class="qr" src="${QR}"></div></div>`;show('receiptDoc')}function disbursements(){document.getElementById('disbursements').innerHTML=`<div class="top"><h1>سندات الصرف</h1><button class="btn gold" onclick="show('disbursementForm')">+ إنشاء سند صرف</button></div><div class="card"><table class="table"><tr><th>الرقم</th><th>المالك</th><th>العقار</th><th>التصنيف</th><th>المبلغ</th><th>فاتورة</th><th></th></tr>${db.disbursements.slice().reverse().map(d=>`<tr><td>${d.no}</td><td>${owner(d.ownerId)}</td><td>${prop(d.propertyId)}</td><td>${d.category}</td><td>${money(d.amount)}</td><td>${d.attachment?'<span class="badge">مرفق</span>':'—'}</td><td><button class="btn light" onclick="openDisbursement('${d.id}')">فتح</button></td></tr>`).join('')}</table></div>`}function disbursementForm(){document.getElementById('disbursementForm').innerHTML=`<div class="top"><h1>إنشاء سند صرف</h1><button class="btn light" onclick="show('disbursements')">رجوع</button></div><div class="card"><div class="formgrid"><div><label>المالك</label><select id="df_owner">${db.owners.map(o=>`<option value="${o.id}">${o.name}</option>`).join('')}</select></div><div><label>العقار</label><select id="df_prop">${db.properties.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select></div><div><label>التصنيف</label><select id="df_cat"><option>صيانة</option><option>كهرباء</option><option>مياه</option><option>رسوم</option><option>أخرى</option></select></div><div><label>المبلغ</label><input id="df_amount" type="number" min="0"></div><div><label>التاريخ</label><input id="df_date" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div><label>طريقة الدفع</label><select id="df_method"><option>تحويل بنكي</option><option>نقداً</option><option>بطاقة</option><option>شيك</option></select></div><div class="full"><label>الوصف</label><textarea id="df_desc"></textarea></div><div class="full"><label>إرفاق فاتورة PDF/JPG/PNG</label><input id="df_file" type="file" accept=".pdf,.jpg,.jpeg,.png"></div><div class="full"><button class="btn gold" onclick="saveDisbursement()">حفظ وفتح السند</button></div></div></div>`}function saveDisbursement(){let f=document.getElementById('df_file').files[0],finish=a=>{let d={id:id(),no:next('SD',db.disbursements),ownerId:document.getElementById('df_owner').value,propertyId:document.getElementById('df_prop').value,category:document.getElementById('df_cat').value,amount:Number(document.getElementById('df_amount').value||0),date:document.getElementById('df_date').value,method:document.getElementById('df_method').value,description:document.getElementById('df_desc').value,attachment:a||''};db.disbursements.push(d);save();openDisbursement(d.id)};if(f){let r=new FileReader;r.onload=()=>finish(r.result);r.readAsDataURL(f)}else finish('')}function openDisbursement(x){window.currentDisbursement=db.disbursements.find(d=>d.id===x);disbursementDoc(window.currentDisbursement)}function disbursementDoc(d){document.getElementById('disbursementDoc').innerHTML=`<div class="top no-print"><h1>${d.no}</h1><div><button class="btn gold" onclick="printDoc('disbursementDoc')">طباعة / PDF</button> <button class="btn light" onclick="show('disbursements')">رجوع</button></div></div><div class="doc"><div class="dochead"><img src="${LOGO}"><div class="doctitle"><h2>سند صرف</h2><b>الأولى لإدارة الأملاك</b><div>رقم السند: ${d.no}</div></div></div><table class="doctable"><tr><th>المالك</th><td>${owner(d.ownerId)}</td><th>التاريخ</th><td>${d.date}</td></tr><tr><th>العقار</th><td>${prop(d.propertyId)}</td><th>التصنيف</th><td>${d.category}</td></tr><tr><th>طريقة الدفع</th><td>${d.method}</td><th>المبلغ</th><td><b>${money(d.amount)}</b></td></tr></table><p><b>الوصف:</b> ${d.description||''}</p><p><b>الفاتورة:</b> ${d.attachment?'مرفقة':'لا يوجد مرفق'}</p><div style="text-align:left"><img class="qr" src="${QR}"></div></div>`;show('disbursementDoc')}function cash(){let i=db.receipts.reduce((a,x)=>a+Number(x.amount),0),e=db.disbursements.reduce((a,x)=>a+Number(x.amount),0);document.getElementById('cash').innerHTML=`<div class="top"><h1>الذمة المالية للمكتب</h1></div><div class="cards"><div class="card"><div class="muted">الرصيد الافتتاحي</div><div class="num">${money(db.openingBalance)}</div></div><div class="card"><div class="muted">الدخل</div><div class="num">${money(i)}</div></div><div class="card"><div class="muted">المصروفات</div><div class="num">${money(e)}</div></div><div class="card"><div class="muted">الرصيد الختامي</div><div class="num">${money(Number(db.openingBalance)+i-e)}</div></div></div><div class="card"><label>الرصيد الافتتاحي</label><input type="number" value="${db.openingBalance}" onchange="db.openingBalance=Number(this.value||0);save();cash()"></div>`}function reports(){document.getElementById('reports').innerHTML=`<div class="top"><h1>التقارير</h1></div><div class="cards"><div class="card"><h3>تقرير الملاك</h3><p>القبض − الصرف = صافي التحويل</p><button class="btn gold" onclick="exportExcel('owners')">Excel</button><button class="btn light" onclick="window.print()">PDF / طباعة</button></div><div class="card"><h3>كشف المستأجرين</h3><p>الإيجار والمدفوع والمتبقي.</p><button class="btn gold" onclick="exportExcel('tenants')">Excel</button></div></div>`}function exportExcel(t){let rows=t==='owners'?db.owners.map(o=>{let i=db.receipts.filter(r=>r.ownerId===o.id).reduce((a,x)=>a+Number(x.amount),0),e=db.disbursements.filter(r=>r.ownerId===o.id).reduce((a,x)=>a+Number(x.amount),0);return[o.name,i,e,i-e]}):db.tenants.map(x=>{let p=db.receipts.filter(r=>r.tenantId===x.id).reduce((a,y)=>a+Number(y.amount),0);return[x.name,x.rent,p,Math.max(0,x.rent-p)]});let h=t==='owners'?['المالك','القبض','الصرف','الصافي']:['المستأجر','الإيجار','المدفوع','المتبقي'];let table='<table><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</table>';let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+table],{type:'application/vnd.ms-excel'}));a.download='ALOLA-'+t+'.xls';a.click()}function printDoc(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('printing'));document.getElementById(id).classList.add('printing');window.print();setTimeout(()=>document.getElementById(id).classList.remove('printing'),500)}show('dashboard');
</script></body></html>
